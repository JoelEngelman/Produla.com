name: Build Produla Studio for Windows

on:
  push:
    branches:
      - main
    paths:
      - "src/Studio.jsx"
      - "src/Studio.css"
      - "src/App.jsx"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows desktop app
        run: npm run desktop
        env:
          VITE_BASE_PATH: /
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: produla-studio-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
