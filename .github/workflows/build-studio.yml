name: Build Produla Studio desktop apps

on:
  push:
    branches:
      - main
    tags:
      - "studio-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build desktop packages
        run: npm run desktop
        env:
          VITE_BASE_PATH: /
      - uses: actions/upload-artifact@v4
        with:
          name: produla-studio-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/studio-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Produla Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
